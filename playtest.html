<!DOCTYPE html>
<!-- QA helper: boots straight into a level for the goal-oriented playtest agents (qa/playtest-agents/).
     /playtest.html?level=N                         play level N yourself (skips title and menu)
     /playtest.html?level=N&agent=brawler            watch an agent play it (persona list in qa/playtest-agents/personas.js)
     /playtest.html?level=1&wave=5&agent=boss-hunter        one boss fight (?wave is ArenaScene's own test flag)
     Game code is untouched: the agent only presses keys and reads scene state. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Playtest agents: The Rebellion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; height: 100%; background: #2E1F16; overflow: hidden; }
    #game { width: 100%; height: 100%; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game"></div>
  <script type="module">
    import ArenaScene from './src/scenes/ArenaScene.js';
    import HudScene from './src/scenes/HudScene.js';
    import ResultScene from './src/scenes/ResultScene.js';
    import { loadLevelContent } from './src/levels/levelData.js';
    const q = new URLSearchParams(location.search);
    const fetchJson = (p) => fetch(p, { cache: 'no-store' }).then((r) => { if (!r.ok) throw new Error(p); return r.json(); });
    const levels = await loadLevelContent(fetchJson);
    const LEVEL_INDEX = Math.min(Math.max(0, (Number(q.get('level')) || 1) - 1), levels.length - 1);
    const game = new Phaser.Game({
      type: q.get('renderer') === 'canvas' ? Phaser.CANVAS : Phaser.AUTO,  // ?renderer=canvas for machines without a GPU (CI)
      parent: 'game',
      width: 1280,
      height: 720,
      backgroundColor: '#2E1F16',
      scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
      input: { gamepad: true },
      physics: { default: 'arcade', arcade: { debug: false } },
      scene: [ArenaScene, HudScene, ResultScene],
      callbacks: { preBoot: (g) => g.registry.set('levels', levels) },
    });
    window.__game = game;
    window.__levels = levels;
    if (q.has('agent')) {
      const { startAgent } = await import('./qa/playtest-agents/agent.js');
      window.__agent = startAgent(game, { persona: q.get('agent'), levelIndex: LEVEL_INDEX, seed: Number(q.get('seed')) || 1 });
    }
  </script>
</body>
</html>
