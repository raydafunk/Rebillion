<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Rebellion: Fists of the Fallen City</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; height: 100%; background: #2E1F16; overflow: hidden; }
    #game { width: 100%; height: 100%; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game"></div>
  <script type="module">
    import MenuScene from './src/ui/MenuScene.js';
    import { waitForFonts } from './src/config/assetKeys.js';
    // Wait for web fonts (2.5s cap) so the first canvas frame is not in a fallback font.
    await waitForFonts();
    const game = new Phaser.Game({
      type: Phaser.AUTO,
      parent: 'game',
      width: 1280,
      height: 720,
      backgroundColor: '#2E1F16',
      scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
      scene: [MenuScene],
    });
    game.events.on('start-game', () => console.log('start-game event received'));
    window.__game = game;
  </script>
</body>
</html>
